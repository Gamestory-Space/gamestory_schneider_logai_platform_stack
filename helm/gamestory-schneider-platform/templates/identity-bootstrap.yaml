{{- if .Values.identityBootstrap.enabled }}
{{- $root := . -}}
{{- $realm := .Files.Get "files/gamestory-sso-realm.json" | fromJson -}}
{{- $ui := include "schneider.uiUrl" . -}}
{{- range $client := $realm.clients -}}
{{- if eq $client.clientId "logai-ui" -}}
{{- $_ := set $client "redirectUris" (list (printf "%s/auth/callback" $ui)) -}}
{{- $_ := set $client "webOrigins" (list $ui) -}}
{{- $_ := set $client.attributes "post.logout.redirect.uris" (printf "%s/" $ui) -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "schneider.name" . }}-identity-bootstrap
  labels: {{- include "schneider.labels" . | nindent 4 }}
data:
  realm.json: {{ $realm | toJson | quote }}
  users.json: {{ .Files.Get "files/bootstrap-groups.json" | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "schneider.name" . }}-identity-bootstrap
  labels: {{- include "schneider.labels" . | nindent 4 }}
  annotations:
    {{- if eq .Values.identityBootstrap.hookMode "argo" }}
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    {{- else if eq .Values.identityBootstrap.hookMode "helm" }}
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-1"
    {{- else }}
    {{- fail "identityBootstrap.hookMode must be helm or argo" }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.identityBootstrap.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.identityBootstrap.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.identityBootstrap.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels: {{- include "schneider.selectorLabels" (dict "root" . "component" "identity-bootstrap") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: identity-bootstrap
          image: {{ include "schneider.image" .Values.identityApi.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: [python, -c, "from app.bootstrap import main; main()"]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          env:
            - {name: KEYCLOAK_BOOTSTRAP_URL, value: {{ include "schneider.internalKeycloakUrl" . | quote }}}
            - {name: KEYCLOAK_PUBLIC_URL, value: {{ include "schneider.keycloakUrl" . | quote }}}
            - {name: KEYCLOAK_BOOTSTRAP_ALLOW_INTERNAL_HTTP, value: "true"}
            - {name: KEYCLOAK_ADMIN_USERNAME_FILE, value: /runtime-secrets/admin/username}
            - {name: KEYCLOAK_ADMIN_PASSWORD_FILE, value: /runtime-secrets/admin/password}
            - {name: KEYCLOAK_BOOTSTRAP_PASSWORD_FILE, value: /runtime-secrets/users/password}
          resources: {{- toYaml .Values.identityBootstrap.resources | nindent 12 }}
          volumeMounts:
            - {name: configuration, mountPath: /bootstrap, readOnly: true}
            - {name: admin-secret, mountPath: /runtime-secrets/admin, readOnly: true}
            - {name: user-secret, mountPath: /runtime-secrets/users, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: configuration
          configMap: {name: {{ include "schneider.name" . }}-identity-bootstrap}
        - name: admin-secret
          secret:
            secretName: {{ include "schneider.adminSecretName" . }}
            defaultMode: 0440
            items:
              - {key: {{ .Values.keycloak.adminUserKey }}, path: username}
              - {key: {{ .Values.keycloak.adminPasswordKey }}, path: password}
        - name: user-secret
          secret:
            secretName: {{ required "identityBootstrap.existingSecret must name a runtime initial-user Secret" .Values.identityBootstrap.existingSecret }}
            defaultMode: 0440
            items: [{key: {{ .Values.identityBootstrap.passwordKey }}, path: password}]
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
{{- end }}
