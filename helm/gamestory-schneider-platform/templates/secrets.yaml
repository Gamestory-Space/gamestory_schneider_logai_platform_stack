{{- if and .Values.postgres.enabled (not .Values.postgres.existingSecret) }}
{{- $secretName := printf "%s-postgres" (include "schneider.name" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := randAlphaNum 32 -}}
{{- if and $existing $existing.data (hasKey $existing.data "password") -}}
{{- $password = index $existing.data "password" | b64dec -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels: {{- include "schneider.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
---
{{- end }}
{{- if and .Values.keycloak.enabled (not .Values.keycloak.existingAdminSecret) }}
{{- $secretName := printf "%s-keycloak-admin" (include "schneider.name" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := randAlphaNum 32 -}}
{{- if and $existing $existing.data (hasKey $existing.data "password") -}}
{{- $password = index $existing.data "password" | b64dec -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels: {{- include "schneider.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: admin
  password: {{ $password | quote }}
{{- end }}
