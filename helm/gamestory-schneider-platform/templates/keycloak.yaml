{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "schneider.name" . }}-keycloak
  labels: {{- include "schneider.labels" . | nindent 4 }}
spec:
  selector: {{- include "schneider.selectorLabels" (dict "root" . "component" "keycloak") | nindent 4 }}
  ports: [{name: http, port: {{ .Values.keycloak.service.port }}, targetPort: http}, {name: management, port: {{ .Values.keycloak.service.managementPort }}, targetPort: management}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "schneider.name" . }}-keycloak
  labels: {{- include "schneider.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.keycloak.replicas }}
  selector:
    matchLabels: {{- include "schneider.selectorLabels" (dict "root" . "component" "keycloak") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels: {{- include "schneider.selectorLabels" (dict "root" . "component" "keycloak") | nindent 8 }}
    spec:
      {{- with .Values.global.serviceAccountName }}
      serviceAccountName: {{ . | quote }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: keycloak
          image: {{ include "schneider.image" .Values.keycloak.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: {{ toJson .Values.keycloak.command }}
          ports: [{name: http, containerPort: 8080}, {name: management, containerPort: 9000}]
          env:
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_HOSTNAME, value: {{ include "schneider.keycloakUrl" . | quote }}}
            {{- with .Values.keycloak.proxyHeaders }}
            - {name: KC_PROXY_HEADERS, value: {{ . | quote }}}
            {{- end }}
            - {name: KC_DB, value: postgres}
            - name: KC_DB_URL
              value: {{ printf "jdbc:postgresql://%s:%v/%s?sslmode=%s" (ternary .Values.externalDatabase.host (printf "%s-postgres" (include "schneider.name" .)) .Values.externalDatabase.enabled) (ternary .Values.externalDatabase.port .Values.postgres.service.port .Values.externalDatabase.enabled) (ternary .Values.externalDatabase.database .Values.postgres.database .Values.externalDatabase.enabled) (ternary .Values.externalDatabase.sslMode "disable" .Values.externalDatabase.enabled) | quote }}
            - name: KC_DB_USERNAME
              value: {{ ternary .Values.externalDatabase.username .Values.postgres.username .Values.externalDatabase.enabled | quote }}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "schneider.dbSecretName" . }}, key: {{ ternary .Values.externalDatabase.passwordKey .Values.postgres.passwordKey .Values.externalDatabase.enabled }}}}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: {secretKeyRef: {name: {{ include "schneider.adminSecretName" . }}, key: {{ .Values.keycloak.adminUserKey }}}}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "schneider.adminSecretName" . }}, key: {{ .Values.keycloak.adminPasswordKey }}}}
          volumeMounts:
            - {name: data, mountPath: /opt/keycloak/data}
            - {name: tmp, mountPath: /tmp}
            - {name: upstream-licenses, mountPath: /usr/share/licenses/logai-platform/keycloak, readOnly: true}
            {{- if .Values.identityBootstrap.enabled }}
            - {name: realm-import, mountPath: /opt/keycloak/data/import, readOnly: true}
            {{- end }}
          startupProbe:
            httpGet: {path: /health/started, port: management}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: {{ .Values.probes.periodSeconds }}
          livenessProbe:
            httpGet: {path: /health/live, port: management}
            periodSeconds: {{ .Values.probes.periodSeconds }}
          resources: {{- toYaml .Values.keycloak.resources | nindent 12 }}
      volumes:
        - name: upstream-licenses
          configMap:
            name: {{ include "schneider.name" . }}-upstream-licenses
            items:
              - {key: keycloak-LICENSE, path: LICENSE}
              - {key: keycloak-NOTICE, path: NOTICE}
        - {name: data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        {{- if .Values.identityBootstrap.enabled }}
        - name: realm-import
          configMap:
            name: {{ include "schneider.name" . }}-identity-bootstrap
            items: [{key: realm.json, path: gamestory-sso-realm.json}]
        {{- end }}
{{- end }}
