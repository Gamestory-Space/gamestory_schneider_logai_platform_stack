name: Deploy Platform to EKS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - uat
          - prod
      version:
        description: Platform release version, for example v0.1.4
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-eks-${{ inputs.environment }}
  cancel-in-progress: false

env:
  OCI_REPOSITORY: docker.io/chrismdgs/gamestory_logai_schneider
  RELEASE_NAME: logai

jobs:
  deploy:
    name: Deploy ${{ inputs.version }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      NAMESPACE: ${{ vars.HELM_NAMESPACE || format('logai-{0}', inputs.environment) }}
      PLATFORM_VERSION: ${{ inputs.version }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          HELM_PRIVATE_VALUES: ${{ secrets.HELM_PRIVATE_VALUES }}
        run: |
          set -euo pipefail
          [[ "$PLATFORM_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || {
            echo "Invalid platform version: $PLATFORM_VERSION" >&2
            exit 1
          }
          for name in AWS_REGION EKS_CLUSTER_NAME AWS_ROLE_ARN DOCKERHUB_USERNAME DOCKERHUB_TOKEN HELM_PRIVATE_VALUES; do
            [[ -n "${!name}" ]] || { echo "Required environment variable or secret is missing: $name" >&2; exit 1; }
          done

      - uses: oras-project/setup-oras@v1
      - uses: azure/setup-helm@v5

      - name: Pull released platform bundle
        id: bundle
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/platform-artifact" "${RUNNER_TEMP}/platform"
          printf '%s' "$DOCKERHUB_TOKEN" | oras login docker.io \
            --username "$DOCKERHUB_USERNAME" --password-stdin
          reference="${OCI_REPOSITORY}:platform-${PLATFORM_VERSION}"
          digest="$(oras resolve "$reference")"
          oras pull --output "${RUNNER_TEMP}/platform-artifact" "${reference}@${digest}"

          archive="$(find "${RUNNER_TEMP}/platform-artifact" -type f -name 'schneider-logai-platform-*.zip' -print -quit)"
          [[ -n "$archive" ]] || { echo 'Platform ZIP was not found in the OCI artifact.' >&2; exit 1; }
          checksum="${archive}.sha256"
          [[ -f "$checksum" ]] || { echo "Checksum file was not found: $checksum" >&2; exit 1; }
          expected="$(awk 'NR == 1 { print $1 }' "$checksum")"
          actual="$(sha256sum "$archive" | awk '{ print $1 }')"
          [[ "$actual" == "$expected" ]] || { echo 'Platform ZIP checksum verification failed.' >&2; exit 1; }

          unzip -q "$archive" -d "${RUNNER_TEMP}/platform"
          bundle_root="$(find "${RUNNER_TEMP}/platform" -mindepth 1 -maxdepth 1 -type d -name 'schneider-logai-platform-*' -print -quit)"
          [[ -n "$bundle_root" ]] || { echo 'Extracted platform bundle was not found.' >&2; exit 1; }
          echo "root=$bundle_root" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: logai-${{ inputs.environment }}-${{ github.run_id }}

      - name: Configure EKS access
        shell: bash
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Validate target and render chart
        shell: bash
        env:
          BUNDLE_ROOT: ${{ steps.bundle.outputs.root }}
          PRIVATE_VALUES: ${{ secrets.HELM_PRIVATE_VALUES }}
        run: |
          set -euo pipefail
          context="$(kubectl config current-context)"
          [[ "$context" == arn:aws:eks:* ]] || { echo "Current context is not AWS EKS: $context" >&2; exit 1; }
          aws sts get-caller-identity
          printf '%s' "$PRIVATE_VALUES" > "${RUNNER_TEMP}/private-values.yaml"
          chmod 600 "${RUNNER_TEMP}/private-values.yaml"
          chart="${BUNDLE_ROOT}/helm/gamestory-schneider-platform"
          values="${BUNDLE_ROOT}/environments/${{ inputs.environment }}/values.yaml"
          helm lint "$chart" --values "$values" --values "${RUNNER_TEMP}/private-values.yaml"
          helm template "$RELEASE_NAME" "$chart" \
            --namespace "$NAMESPACE" \
            --values "$values" --values "${RUNNER_TEMP}/private-values.yaml" >/dev/null

      - name: Deploy with Helm
        shell: bash
        env:
          BUNDLE_ROOT: ${{ steps.bundle.outputs.root }}
        run: |
          set -euo pipefail
          helm upgrade --install "$RELEASE_NAME" "${BUNDLE_ROOT}/helm/gamestory-schneider-platform" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --values "${BUNDLE_ROOT}/environments/${{ inputs.environment }}/values.yaml" \
            --values "${RUNNER_TEMP}/private-values.yaml" \
            --atomic \
            --wait \
            --timeout 10m \
            --history-max 10
          kubectl rollout status deployment --all --namespace "$NAMESPACE" --timeout=10m
          helm status "$RELEASE_NAME" --namespace "$NAMESPACE"

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '### EKS platform deployment'
            printf '%s\n' '- Environment: `${{ inputs.environment }}`'
            printf '%s\n' "- Version: \`$PLATFORM_VERSION\`"
            printf '%s\n' '- OCI digest: `${{ steps.bundle.outputs.digest || 'unavailable' }}`'
            printf '%s\n' "- Cluster: \`$EKS_CLUSTER_NAME\`"
            printf '%s\n' "- Namespace: \`$NAMESPACE\`"
            echo '- Helm release: `logai`'
          } >> "$GITHUB_STEP_SUMMARY"
