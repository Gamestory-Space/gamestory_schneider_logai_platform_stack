# Source: gamestory-schneider-platform/templates/apps.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logai-gamestory-schneider-platform-identity-api
  labels:
    app.kubernetes.io/part-of: gamestory-schneider-platform
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "gamestory-schneider-platform-0.1.7"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: logai-gamestory-schneider-platform-identity-api
      app.kubernetes.io/instance: logai
  template:
    metadata:
      annotations:
        checksum/config: 9a00ac30fa967472df8655c7bbb2b0962b1d89630c5a49e3f0a3216f12752f60
      labels:
        app.kubernetes.io/name: logai-gamestory-schneider-platform-identity-api
        app.kubernetes.io/instance: logai
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: identity-api
          image: "docker.io/chrismdgs/gamestory_logai_schneider:identity-api-v0.1.7"
          imagePullPolicy: Always
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: logai-gamestory-schneider-platform-config}}]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
      nodeSelector:
        {}
      tolerations:
        []
      affinity:
        {}

