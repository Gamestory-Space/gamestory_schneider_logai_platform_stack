apiVersion: batch/v1
kind: Job
metadata:
  name: logai-gamestory-schneider-platform-identity-bootstrap
  labels:
    app.kubernetes.io/part-of: gamestory-schneider-platform
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "gamestory-schneider-platform-0.1.7"
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-1"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logai-gamestory-schneider-platform-identity-bootstrap
        app.kubernetes.io/instance: logai
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: identity-bootstrap
          image: "docker.io/chrismdgs/gamestory_logai_schneider:identity-api-v0.1.7"
          imagePullPolicy: Always
          command: [python, -c, "from app.bootstrap import main; main()"]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          env:
            - {name: KEYCLOAK_BOOTSTRAP_URL, value: "http://logai-gamestory-schneider-platform-keycloak.default.svc:8080"}
            - {name: KEYCLOAK_PUBLIC_URL, value: "https://keycloak-uat.example.invalid"}
            - {name: KEYCLOAK_BOOTSTRAP_ALLOW_INTERNAL_HTTP, value: "true"}
            - {name: KEYCLOAK_ADMIN_USERNAME_FILE, value: /runtime-secrets/admin/username}
            - {name: KEYCLOAK_ADMIN_PASSWORD_FILE, value: /runtime-secrets/admin/password}
            - {name: KEYCLOAK_BOOTSTRAP_PASSWORD_MODE, value: "username"}
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - {name: configuration, mountPath: /bootstrap, readOnly: true}
            - {name: admin-secret, mountPath: /runtime-secrets/admin, readOnly: true}
