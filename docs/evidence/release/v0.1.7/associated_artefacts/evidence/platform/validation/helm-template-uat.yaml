          imagePullPolicy: Always
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: logai-gamestory-schneider-platform-config}}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: schneider-managed-uat-database, key: databaseUrl}}
            - {name: APPLY_DATABASE_SCHEMA_ON_STARTUP, value: "false"}
            - {name: SEED_SAMPLE_DATA_ON_STARTUP, value: "false"}
