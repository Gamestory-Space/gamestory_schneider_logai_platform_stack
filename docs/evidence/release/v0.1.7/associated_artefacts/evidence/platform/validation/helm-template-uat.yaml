      app.kubernetes.io/instance: logai
  template:
    metadata:
      annotations:
        checksum/config: 9a00ac30fa967472df8655c7bbb2b0962b1d89630c5a49e3f0a3216f12752f60
      labels:
        app.kubernetes.io/name: logai-gamestory-schneider-platform-logai-api
        app.kubernetes.io/instance: logai
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
