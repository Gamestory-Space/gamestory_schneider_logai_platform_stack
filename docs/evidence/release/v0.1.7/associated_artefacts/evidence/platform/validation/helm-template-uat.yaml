data:
  realm.json: "{\"accessTokenLifespan\":300,\"bruteForceProtected\":true,\"clients\":[{\"attributes\":{\"pkce.code.challenge.method\":\"S256\",\"post.logout.redirect.uris\":\"https://logai-uat.example.invalid/\"},\"clientId\":\"logai-ui\",\"defaultClientScopes\":[\"basic\",\"profile\",\"email\",\"roles\",\"web-origins\",\"acr\"],\"directAccessGrantsEnabled\":false,\"enabled\":true,\"implicitFlowEnabled\":false,\"name\":\"LogAI UI\",\"protocol\":\"openid-connect\",\"protocolMappers\":[{\"config\":{\"access.token.claim\":\"true\",\"id.token.claim\":\"false\",\"included.client.audience\":\"logai-api\"},\"consentRequired\":false,\"name\":\"logai-api-audience\",\"protocol\":\"openid-connect\",\"protocolMapper\":\"oidc-audience-mapper\"}],\"publicClient\":true,\"redirectUris\":[\"https://logai-uat.example.invalid/auth/callback\"],\"serviceAccountsEnabled\":false,\"standardFlowEnabled\":true,\"webOrigins\":[\"https://logai-uat.example.invalid\"]},{\"bearerOnly\":true,\"clientId\":\"logai-api\",\"directAccessGrantsEnabled\":false,\"enabled\":true,\"name\":\"LogAI API resource\",\"protocol\":\"openid-connect\",\"publicClient\":false,\"serviceAccountsEnabled\":false,\"standardFlowEnabled\":false}],\"components\":{\"org.keycloak.userprofile.UserProfileProvider\":[{\"config\":{\"kc.user.profile.config\":[\"{\\\"attributes\\\": [{\\\"name\\\": \\\"username\\\", \\\"required\\\": {\\\"roles\\\": [\\\"user\\\"]}, \\\"permissions\\\": {\\\"view\\\": [\\\"admin\\\", \\\"user\\\"], \\\"edit\\\": [\\\"admin\\\", \\\"user\\\"]}, \\\"validations\\\": {\\\"length\\\": {\\\"min\\\": 3, \\\"max\\\": 255}}}, {\\\"name\\\": \\\"email\\\", \\\"permissions\\\": {\\\"view\\\": [\\\"admin\\\", \\\"user\\\"], \\\"edit\\\": [\\\"admin\\\", \\\"user\\\"]}, \\\"validations\\\": {\\\"email\\\": {}}}, {\\\"name\\\": \\\"firstName\\\", \\\"permissions\\\": {\\\"view\\\": [\\\"admin\\\", \\\"user\\\"], \\\"edit\\\": [\\\"admin\\\", \\\"user\\\"]}, \\\"validations\\\": {}}, {\\\"name\\\": \\\"lastName\\\", \\\"permissions\\\": {\\\"view\\\": [\\\"admin\\\", \\\"user\\\"], \\\"edit\\\": [\\\"admin\\\", \\\"user\\\"]}, \\\"validations\\\": {}}]}\"]},\"providerId\":\"declarative-user-profile\"}]},\"defaultDefaultClientScopes\":[\"basic\",\"profile\",\"email\",\"roles\",\"web-origins\",\"acr\"],\"duplicateEmailsAllowed\":false,\"enabled\":true,\"groups\":[{\"name\":\"logai_admin\",\"realmRoles\":[\"logai-admin\"]},{\"name\":\"as_lead\",\"realmRoles\":[\"as-lead\"]}],\"identityProviders\":[],\"loginWithEmailAllowed\":true,\"realm\":\"gamestory-sso\",\"registrationAllowed\":false,\"resetPasswordAllowed\":false,\"roles\":{\"realm\":[{\"description\":\"LogAI Admin; canonical human role\",\"name\":\"logai-admin\"},{\"description\":\"LogAI AS Lead; canonical human role\",\"name\":\"as-lead\"},{\"description\":\"Technical callback identity only; never assign to bootstrap humans\",\"name\":\"logai-integration\"}]},\"sslRequired\":\"external\",\"ssoSessionIdleTimeout\":1800,\"ssoSessionMaxLifespan\":36000}"
  users.json: "{\n  \"chris\": [\n    \"logai_admin\"\n  ],\n  \"elvis\": [\n    \"as_lead\"\n  ],\n  \"beau\": [\n    \"as_lead\"\n  ],\n  \"sunil\": [\n    \"as_lead\"\n  ]\n}\n"

