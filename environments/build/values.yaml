global:
  environment: build
  imagePullPolicy: IfNotPresent
identityApi:
  image:
    repository: docker.io/chrismdgs/gamestory_logai_schneider
    tag: identity-api-v0.1.7
    digest: ''
logaiApi:
  image:
    repository: docker.io/chrismdgs/gamestory_logai_schneider
    tag: logai-api-v0.1.7
    digest: ''
  applyDatabaseSchemaOnStartup: true
  seedSampleDataOnStartup: true
logaiUi:
  image:
    repository: docker.io/chrismdgs/gamestory_logai_schneider
    tag: logai-ui-v0.1.7
    digest: ''
postgres:
  enabled: true
  existingSecret: logai-database
externalDatabase:
  enabled: false
identity:
  authMode: sso
ingress:
  enabled: false
keycloak:
  existingAdminSecret: ''
