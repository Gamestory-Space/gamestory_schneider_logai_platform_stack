# Example only. Do not put real secret values in git.
#
# Create equivalent Kubernetes secrets in the target namespace before deployment,
# or source them from HashiCorp Vault / External Secrets.

apiVersion: v1
kind: Secret
metadata:
  name: remote-build-dev-entra-idp-credentials
type: Opaque
stringData:
  ENTRA_TENANT_ID: "<local-dev-entra-tenant-id>"
  ENTRA_CLIENT_ID: "<local-dev-entra-client-id>"
  ENTRA_CLIENT_SECRET: "<local-dev-entra-client-secret>"
---
apiVersion: v1
kind: Secret
metadata:
  name: remote-build-dev-teams-bot-credentials
type: Opaque
stringData:
  MICROSOFT_APP_ID: "<local-dev-teams-app-id>"
  MICROSOFT_APP_PASSWORD: "<local-dev-teams-app-password>"
  MICROSOFT_APP_TENANT_ID: "<local-dev-teams-tenant-id>"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-connection
type: Opaque
stringData:
  DATABASE_URL: "<postgres-connection-url>"
