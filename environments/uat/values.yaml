# Override the domain, registry, ingress and Secret references for the site.
global:
  serviceAccountName: logai-srv-uat
  environment: uat
  imagePullPolicy: Always
  imagePullSecrets: []
identityApi:
  image:
    repository: global-artifacts.se.com/gsc-logai-docker-prod-fed/gamestory_logai_schneider
    tag: identity-api-v0.1.7
    digest: sha256:449d3c003f54011a8c6ba3495f27a905822c36f4319fc440e7eb342eed5bdb1e
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
logaiApi:
  # Existing-database upgrades use the reviewed one-off migration plan.
  image:
    repository: global-artifacts.se.com/gsc-logai-docker-prod-fed/gamestory_logai_schneider
    tag: logai-api-v0.1.9-rc.1
    digest: sha256:306fbbca9fd5777a6f84219026ad302b2ff694ed008987744188b4f74172324e
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 1Gi
logaiUi:
  image:
    repository: global-artifacts.se.com/gsc-logai-docker-prod-fed/gamestory_logai_schneider
    tag: logai-ui-v0.1.8-rc.1
    digest: sha256:7ef465cdc0a3250d78960caba5f5fbb8650b5ce39f85a6bcfe08d2fee6152a47
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
postgres:
  enabled: false
externalDatabase:
  enabled: true
  host: uat-postgres.example.invalid
  port: 5432
  database: logai
  username: logai_runtime
  existingSecret: schneider-managed-uat-database
  databaseUrlKey: databaseUrl
  sslMode: require
identity:
  authMode: sso
  domain: example.invalid
keycloak:
  existingAdminSecret: ''
  command:
  - /opt/keycloak/bin/kc.sh
  - start
  - --import-realm
  proxyHeaders: xforwarded
ingress:
  enabled: true
  className: ''
  hosts:
    ui: ''
    api: ''
    identityApi: ''
    keycloak: ''
identityBootstrap:
  # Helm owns the lifecycle; Argo maps these hooks to PostSync.
  hookMode: helm
  existingSecret: schneider-managed-uat-bootstrap-users
