# Override the domain, registry, ingress and Secret references for the site.
global:
  environment: uat
  imagePullPolicy: Always
  imagePullSecrets: []
identityApi:
  image:
    repository: docker.io/chrismdgs/gamestory_logai_schneider
    tag: identity-api-v0.1.6
    digest: ''
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
logaiApi:
  image:
    repository: docker.io/chrismdgs/gamestory_logai_schneider
    tag: logai-api-v0.1.6
    digest: ''
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 1Gi
logaiUi:
  image:
    repository: docker.io/chrismdgs/gamestory_logai_schneider
    tag: logai-ui-v0.1.6
    digest: ''
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
postgres:
  enabled: false
externalDatabase:
  enabled: true
  host: uat-postgres.example.invalid
  port: 5432
  database: logai
  username: logai_runtime
  existingSecret: schneider-managed-uat-database
  databaseUrlKey: databaseUrl
  sslMode: require
identity:
  authMode: sso
  domain: example.invalid
keycloak:
  existingAdminSecret: schneider-managed-uat-keycloak-admin
  command:
  - /opt/keycloak/bin/kc.sh
  - start
  - --import-realm
  proxyHeaders: xforwarded
ingress:
  enabled: true
  className: ''
  hosts:
    ui: ''
    api: ''
    identityApi: ''
    keycloak: ''
identityBootstrap:
  # Helm owns the lifecycle; Argo maps these hooks to PostSync.
  hookMode: helm
  existingSecret: schneider-managed-uat-bootstrap-users
