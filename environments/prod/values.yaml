# Override the domain, registry, ingress and Secret references for the site.
global:
  environment: prod
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
identityApi:
  replicas: 2
  image:
    repository: global-artifacts.se.com/gsc-logai-docker-prod-fed/gamestory_logai_schneider
    tag: identity-api-v0.1.7
    digest: sha256:449d3c003f54011a8c6ba3495f27a905822c36f4319fc440e7eb342eed5bdb1e
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi
logaiApi:
  replicas: 2
  image:
    repository: global-artifacts.se.com/gsc-logai-docker-prod-fed/gamestory_logai_schneider
    tag: logai-api-v0.1.8
    digest: sha256:14a1b3e6a36def12e1553e9bae2bee2b91317b989d54338a0aeb7e7f99b90357
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: '2'
      memory: 2Gi
logaiUi:
  replicas: 2
  image:
    repository: global-artifacts.se.com/gsc-logai-docker-prod-fed/gamestory_logai_schneider
    tag: logai-ui-v0.1.7
    digest: sha256:4254cae40587d1d1c5f35fa150f48f127169f8c9dc829dda43473a9c214ba53e
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
keycloak:
  replicas: 2
  existingAdminSecret: ''
  command:
  - /opt/keycloak/bin/kc.sh
  - start
  - --import-realm
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 2Gi
  proxyHeaders: xforwarded
postgres:
  enabled: false
externalDatabase:
  enabled: true
  host: prod-postgres.example.invalid
  port: 5432
  database: logai
  username: logai_runtime
  existingSecret: schneider-managed-prod-database
  databaseUrlKey: databaseUrl
  sslMode: require
identity:
  authMode: sso
  domain: example.invalid
ingress:
  enabled: true
  className: ''
  tls:
  - secretName: schneider-managed-prod-tls
    hosts:
    - logai-prod.example.invalid
    - api-prod.example.invalid
    - identity-prod.example.invalid
    - keycloak-prod.example.invalid
  hosts:
    ui: ''
    api: ''
    identityApi: ''
    keycloak: ''
identityBootstrap:
  # Helm owns the lifecycle; Argo maps these hooks to PostSync.
  hookMode: helm
  existingSecret: schneider-managed-prod-bootstrap-users
