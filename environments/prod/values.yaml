# Override the domain, registry, ingress and Secret references for the site.
global:
  environment: prod
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
identityApi:
  replicas: 2
  image:
    repository: docker.io/chrismdgs/gamestory_logai_schneider
    tag: identity-api-v0.1.6
    digest: ''
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi
logaiApi:
  replicas: 2
  image:
    repository: docker.io/chrismdgs/gamestory_logai_schneider
    tag: logai-api-v0.1.6
    digest: ''
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: '2'
      memory: 2Gi
logaiUi:
  replicas: 2
  image:
    repository: docker.io/chrismdgs/gamestory_logai_schneider
    tag: logai-ui-v0.1.6
    digest: ''
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
keycloak:
  replicas: 2
  existingAdminSecret: schneider-managed-prod-keycloak-admin
  command:
  - /opt/keycloak/bin/kc.sh
  - start
  - --import-realm
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 2Gi
  proxyHeaders: xforwarded
postgres:
  enabled: false
externalDatabase:
  enabled: true
  host: prod-postgres.example.invalid
  port: 5432
  database: logai
  username: logai_runtime
  existingSecret: schneider-managed-prod-database
  databaseUrlKey: databaseUrl
  sslMode: require
identity:
  authMode: sso
  domain: example.invalid
ingress:
  enabled: true
  className: ''
  tls:
  - secretName: schneider-managed-prod-tls
    hosts:
    - logai-prod.example.invalid
    - api-prod.example.invalid
    - identity-prod.example.invalid
    - keycloak-prod.example.invalid
  hosts:
    ui: ''
    api: ''
    identityApi: ''
    keycloak: ''
identityBootstrap:
  # Helm owns the lifecycle; Argo maps these hooks to PostSync.
  hookMode: helm
  existingSecret: schneider-managed-prod-bootstrap-users
