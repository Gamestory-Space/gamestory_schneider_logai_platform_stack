apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logai-dev-aws
  namespace: argocd
spec:
  project: <SCHNEIDER_ARGO_PROJECT>
  source:
    repoURL: https://github.schneider-electric.com/gamestory/gamestory_schneider_logai_platform_stack.git
    targetRevision: rel2_v0.1.7
    path: helm/gamestory-schneider-platform
    helm:
      valueFiles:
        - ../../environments/dev-aws/values.yaml
  destination:
    name: <SCHNEIDER_DEV_AWS_EKS_CLUSTER>
    namespace: <LOGAI_DEV_AWS_NAMESPACE>
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
