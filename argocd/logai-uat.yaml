apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logai-uat
  namespace: argocd
spec:
  project: <SCHNEIDER_ARGO_PROJECT>
  source:
    repoURL: https://github.schneider-electric.com/gamestory/gamestory_schneider_logai_platform_stack.git
    targetRevision: <APPROVED_PLATFORM_RELEASE>
    path: helm/gamestory-schneider-platform
    helm:
      valueFiles:
        - ../../environments/uat/values.yaml
  destination:
    name: <SCHNEIDER_UAT_EKS_CLUSTER>
    namespace: <LOGAI_UAT_NAMESPACE>
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
